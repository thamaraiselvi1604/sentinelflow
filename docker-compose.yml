services:
  postgres:
    image: postgres:17
    container_name: sentinelflow-db
    environment:
      POSTGRES_DB: sentinelflow
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sentinel_data:
